<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Beehive Wallet">
  <!-- Beehive mark: a honeycomb cell cluster in the app's amber.
       Replaces a purple lightning bolt that shared nothing with the product's
       actual identity - a wallet whose icon does not match its interface reads
       as a phishing clone, so this is a trust signal, not decoration. -->
  <rect width="64" height="64" rx="14" fill="#b45309"/>
  <g fill="#fbbf24">
    <!-- centre cell -->
    <polygon points="32,20 40,24.6 40,33.8 32,38.4 24,33.8 24,24.6"/>
  </g>
  <g fill="#fde68a">
    <!-- lower-left and lower-right cells, forming the comb -->
    <polygon points="23,36 31,40.6 31,49.8 23,54.4 15,49.8 15,40.6"/>
    <polygon points="41,36 49,40.6 49,49.8 41,54.4 33,49.8 33,40.6"/>
  </g>
</svg>
