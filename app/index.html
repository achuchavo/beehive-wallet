<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%BASE_URL%beehive.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b45309" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beehive" />
    <title>Beehive Wallet</title>
    <meta
      name="description"
      content="Non-custodial Cosmos wallet with outgoing-transaction alarms. Your keys never leave your device."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph / social sharing.
         The host comes from VITE_SITE_URL (see app/.env) rather than being
         hardcoded, so moving to the official domain is one value + a rebuild.
         It cannot be derived at runtime: social crawlers fetch the raw HTML and
         do not execute JavaScript, so these must be correct as served.
         Absolute URLs are required - crawlers ignore relative ones.
         Copy is deliberately platform-neutral ("device", no domain, no "web
         app") so the same card holds up on the App Store / Google Play. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beehive Wallet" />
    <meta property="og:title" content="Beehive Wallet" />
    <meta
      property="og:description"
      content="Non-custodial Cosmos wallet with outgoing-transaction alarms. Your keys never leave your device."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Beehive Wallet — non-custodial Cosmos wallet with transaction alarms"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beehive Wallet" />
    <meta
      name="twitter:description"
      content="Non-custodial Cosmos wallet with outgoing-transaction alarms. Your keys never leave your device."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Beehive Wallet — non-custodial Cosmos wallet with transaction alarms"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
