# Beehive Wallet - security headers (Apache)
# =========================================================================
# Include this in the wallet vhost (wallet.achumuamah.com), inside <VirtualHost>
# or a <Directory> for the docroot. Requires: mod_headers.
#
# The CSP is built from what the app ACTUALLY talks to:
#   - Same-origin only for: HTML/JS/CSS, the JSON API, and the RPC/LCD proxies
#     (browser calls /api/* which relays to nodes server-side).
#   - CoinGecko is NOT listed: prices are fetched server-side by api/price.php,
#     so the browser never contacts CoinGecko.
#   - Keybase is the one remaining third party (validator avatars): a connect to
#     keybase.io for the lookup, and the avatar image (served from Keybase's CDN).
#     To drop these two exceptions and go 'self'-only, proxy the avatar through
#     the backend (like price.php) - see docs/security-headers.md.
#
# No 'unsafe-eval' anywhere. 'unsafe-inline' is used ONLY for style-src (React
# inline style attributes / Tailwind); scripts remain strict.

<IfModule mod_headers.c>
  # --- Content Security Policy ---
  Header always set Content-Security-Policy "\
default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'none'; \
form-action 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: https:; \
font-src 'self'; \
connect-src 'self' https://keybase.io; \
worker-src 'self'; \
manifest-src 'self'; \
upgrade-insecure-requests"

  # --- Transport security (only meaningful over HTTPS) ---
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # --- Defense-in-depth ---
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "DENY"
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Resource-Policy "same-origin"

  # Do not leak the exact PHP version via response headers.
  Header always unset X-Powered-By
</IfModule>

# --- Reduce server version disclosure (put in the main server config) ---
# ServerTokens Prod
# ServerSignature Off
#
# --- In php.ini ---
# expose_php = Off
